<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>赫眉 HYMN · 门店海报</title>
<style>
  /* 界面风格照抖音脚本看板：白底、发丝线分区、直角、无阴影、近黑交互色 */
  :root {
    --ink: #16140F; --t2: #4A453C; --t3: #9C958A; --t4: #B4ADA1;
    --line: #F0EDE6; --line-2: #E3DFD6; --paper: #FAFAF8; --pink: #B9808B;
    --sans: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
    --track: .06em;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #fff; }
  body { color: var(--ink); font: 14px/1.7 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }

  .top { display: flex; align-items: center; gap: 18px; border-bottom: 1px solid var(--line-2); }
  .top img { height: 22px; display: block; }
  .top .st { font-size: 11px; letter-spacing: .3em; color: var(--t3); }
  .pagehead .eyebrow { font-size: 12px; color: var(--t3); letter-spacing: var(--track); }
  .pagehead h2 { font-size: 22px; font-weight: 500; letter-spacing: .04em; margin-top: 2px; }
  .pagehead p { font-size: 13px; color: var(--t3); margin-top: 2px; }

  main { display: grid; }
  .stage { grid-area: stage; }
  .pick { grid-area: pick; }
  .info { grid-area: info; }
  .act { grid-area: act; }
  .sec { border-top: 1px solid var(--line-2); padding-top: 14px; }
  .sec h3 { font-size: 12px; font-weight: 400; color: var(--t3); letter-spacing: var(--track); margin-bottom: 4px; }

  #preview { width: 100%; aspect-ratio: 1; display: block; background: #a8070f; }
  /* 多选：所有海报排成网格 */
  /* 多选：手机上从上往下一张张排；电脑上左边小图列 + 右边大图（见下面电脑版） */
  .grid { display: none; flex-direction: column; gap: 22px; }
  body.multi #preview { display: none; }
  body.multi .grid { display: flex; }
  .card { cursor: pointer; }
  .card canvas { width: 100%; aspect-ratio: 1; display: block; background: #a8070f; outline: 1px solid var(--line-2); outline-offset: 0; }
  .card.on canvas { outline: 3px solid var(--ink); outline-offset: 3px; }
  .card figcaption { font-size: 13px; color: var(--t3); margin-top: 8px; text-align: center; }
  .card.on figcaption { color: var(--ink); font-weight: 600; }
  .card .info, .card .act { cursor: auto; text-align: left; padding: 12px 14px 14px; border: 1px solid var(--ink); }
  .card .info { margin-top: 12px; border-top-width: 3px; border-bottom: 0; }
  .card .act { border-top: 1px solid var(--line-2); }
  .hint-mobile .many, body.multi .hint-mobile .one { display: none; }
  body.multi .hint-mobile .many { display: inline; }
  body:not(.ready) #preview { opacity: .3; }
  .loading { text-align: center; color: var(--t3); font-size: 12px; margin-top: 8px; }
  body.ready .loading { display: none; }

  label { display: block; font-size: 12px; color: var(--t3); letter-spacing: var(--track); margin: 10px 0 4px; }
  input[type=text] {
    width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 0;
    background: #fff; outline: none; -webkit-appearance: none; appearance: none;
  }
  input[type=text]:focus { border-color: var(--ink); }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .item { display: grid; grid-template-columns: 1fr 86px auto; gap: 8px; align-items: end; }
  .note { font-size: 12px; color: var(--pink); margin-top: 4px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 20px;
    border: 1px solid var(--ink); background: #fff; color: var(--ink); border-radius: 0; cursor: pointer;
    font-size: 13px; letter-spacing: var(--track); white-space: nowrap;
  }
  .btn.solid { background: var(--ink); color: #fff; }
  .btn:hover { background: var(--paper); }
  .btn.solid:hover { background: #2e2b24; }
  .btn.sm { height: 40px; padding: 0 12px; font-size: 12px; border-color: var(--line-2); }
  .btn input { display: none; }
  .actions { display: flex; gap: 10px; }
  body.no-store .actions .btn { opacity: .4; }
  .link { background: none; border: 0; color: var(--t3); font-size: 12px; text-decoration: underline; cursor: pointer; margin-top: 12px; }

  /* 选店：搜索框 + 下拉清单 */
  .combo { position: relative; }
  .combo input[type=text] { height: 48px; font-size: 16px; padding-left: 38px; padding-right: 40px; border-color: var(--ink); }
  .combo .mag { position: absolute; left: 13px; top: 15px; width: 17px; height: 17px; color: var(--t3); pointer-events: none; }
  .combo .done { position: absolute; right: 6px; top: 6px; height: 36px; padding: 0 14px; border: 0; background: var(--ink); color: #fff; font-size: 13px; cursor: pointer; display: none; }
  .combo.open .done { display: block; }
  .combo.open input[type=text] { padding-right: 76px; }
  #store-list {
    position: absolute; left: 0; right: 0; top: 47px; z-index: 20; list-style: none;
    max-height: min(70vh, 640px); overflow-y: auto; background: #fff; border: 1px solid var(--ink);
    -webkit-overflow-scrolling: touch;
  }
  #store-list[hidden] { display: none; }
  #store-list button { border: 0; background: none; color: var(--ink); text-decoration: underline; font-size: 12px; cursor: pointer; padding: 0 4px; }
  #store-list .bulk { display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 12px; color: var(--t3); border-bottom: 1px solid var(--line-2); }
  #store-list .bulk span { flex: 1; }
  #store-list .bulk.mgr { color: var(--ink); font-size: 13px; padding: 10px 14px; }
  #store-list .bulk.mgr b { font-weight: 600; }
  #store-list button.solid { background: var(--ink); color: #fff; text-decoration: none; height: 30px; padding: 0 12px; font-size: 12px; }
  #store-list .grp { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; background: var(--paper); font-size: 11px; color: var(--t3); letter-spacing: var(--track); padding: 4px 10px 4px 14px; border-bottom: 1px solid var(--line); }
  #store-list .grp span { margin-left: 6px; color: var(--t4); flex: 1; }
  #store-list .opt { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--line); user-select: none; }
  #store-list .opt i { width: 16px; height: 16px; border: 1px solid var(--t4); flex: none; position: relative; }
  #store-list .opt.on i { background: var(--ink); border-color: var(--ink); }
  #store-list .opt.on i::after { content: ''; position: absolute; left: 5px; top: 1px; width: 4px; height: 9px; border: solid #fff; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
  #store-list .opt:hover, #store-list .opt.kb { background: var(--paper); }
  #store-list .empty { padding: 14px; color: var(--t3); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; max-height: 140px; overflow-y: auto; }
  .chip { display: inline-flex; align-items: center; height: 30px; padding: 0 4px 0 10px; border: 1px solid var(--line-2); font-size: 13px; cursor: pointer; }
  .chip.on { border-color: var(--ink); background: var(--ink); color: #fff; }
  .chip b { font-weight: 400; width: 22px; text-align: center; color: var(--t4); }
  .chip.on b { color: #aaa; }
  .pick .tip { font-size: 12px; color: var(--t3); margin-top: 6px; }

  details summary { cursor: pointer; font-size: 12px; color: var(--t3); letter-spacing: var(--track); list-style: none; padding: 2px 0; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: ''; display: inline-block; margin-left: 8px; vertical-align: -1px; border-left: 8.4px solid currentColor; border-top: 4.9px solid transparent; border-bottom: 4.9px solid transparent; transition: transform .15s; }
  details[open] summary::after { transform: rotate(90deg); }

  #sheet { position: fixed; inset: 0; background: rgba(22,20,15,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 30; }
  #sheet[hidden] { display: none; }
  .sheet-imgs { display: flex; gap: 10px; overflow-x: auto; max-width: 100%; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .sheet-imgs img { flex: none; width: min(78vw, 60vh); max-height: 60vh; object-fit: contain; scroll-snap-align: center; -webkit-touch-callout: default; }
  .sheet-imgs img:only-child { margin: 0 auto; }
  .sheet-btns { display: flex; gap: 10px; }
  #sheet .btn.save { background: #fff; color: var(--ink); border-color: #fff; min-width: 160px; height: 46px; font-size: 15px; }
  #sheet .btn[hidden] { display: none; }
  #sheet p { color: #fff; text-align: center; margin: 14px 0; font-size: 13px; }
  #sheet .btn { background: transparent; color: #fff; border-color: #fff; }


  /* 两个页面：首页（海报列表）/ 编辑页，靠 body 上的 view-* 切换 */
  body.view-gallery .e-only, body.view-editor .g-only { display: none !important; }
  .back { display: inline-block; font-size: 12px; color: var(--t3); letter-spacing: var(--track); text-decoration: none; margin-bottom: 4px; }
  .back:hover { color: var(--ink); }
  .tpl-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 32px 28px; }
  .tpl { display: block; color: inherit; text-decoration: none; }
  .tpl canvas { width: 100%; aspect-ratio: 1; display: block; background: #a8070f; outline: 1px solid var(--line-2); transition: outline-color .15s, outline-offset .15s; }
  .tpl:hover canvas { outline: 2px solid var(--ink); outline-offset: 4px; }
  .tpl .nm { font-size: 15px; margin-top: 12px; }
  .tpl .go { font-size: 12px; color: var(--t3); letter-spacing: var(--track); margin-top: 2px; }
  .tpl:hover .go { color: var(--ink); }

  /* ---------- 电脑版：左边大预览，右边表单 ---------- */
  @media (min-width: 861px) {
    .top { padding: 20px 40px; }
    .pagehead { padding: 26px 40px 4px; max-width: 1320px; margin: 0 auto; }
    .gallery { padding: 24px 40px 56px; max-width: 1320px; margin: 0 auto; }
    main {
      grid-template-columns: minmax(0, 1fr) 360px;
      grid-template-rows: auto auto 1fr;
      grid-template-areas: "stage pick" "stage info" "stage act";
      gap: 20px 48px; padding: 18px 40px 56px; max-width: 1320px; margin: 0 auto; align-items: start;
    }
    .pick { border-top: 0; padding-top: 0; }
    .stage { position: sticky; top: 20px; }
    :root { --pv: min(780px, calc(100vh - 260px)); }
    #preview { max-width: var(--pv); margin: 0 auto; border: 1px solid var(--line-2); }
    .view { display: flex; justify-content: center; gap: 18px; align-items: flex-start; min-width: 0; }
    body.multi #preview { display: block; flex: 0 1 var(--pv); min-width: 0; width: auto; margin: 0; }
    body.multi .grid { flex: none; width: 116px; max-height: var(--pv); overflow-y: auto; gap: 14px; padding: 4px 6px 4px 4px; }
    body.multi .card figcaption { font-size: 11px; margin-top: 4px; }
    body.multi .card canvas { outline-width: 1px; }
    body.multi .card.on canvas { outline: 2px solid var(--ink); outline-offset: 2px; }
    .actions { justify-content: center; margin-top: 18px; }
    .actions .btn { min-width: 150px; }
    .hint-mobile { display: none; }
  }

  /* ---------- 手机版：选店 → 预览 → 信息，下载按钮固定在底部 ---------- */
  @media (max-width: 860px) {
    .top { padding: 14px 16px; }
    .top img { height: 19px; }
    .pagehead { padding: 16px 16px 2px; }
    .pagehead h2 { font-size: 19px; }
    .gallery { padding: 16px 16px 40px; }
    .tpl-list { grid-template-columns: minmax(0, 1fr); gap: 28px; }
    main {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "pick" "stage" "info" "act";
      gap: 16px; padding: 12px 16px calc(84px + env(safe-area-inset-bottom));
    }
    .pick { border-top: 0; padding-top: 0; }
    .hint-mobile { text-align: center; color: var(--t3); font-size: 12px; margin-top: 6px; }
    input[type=text] { font-size: 16px; } /* 防 iPhone 输入时自动放大 */
    #store-list { max-height: 55vh; }
    .actions {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: #fff; border-top: 1px solid var(--line-2);
    }
    .actions .btn { flex: 1; height: 48px; font-size: 15px; }
    .item { grid-template-columns: 1fr 72px auto; }
  }
</style>
</head>
<body class="no-store view-gallery">
<div class="top"><img src="assets/logo-ink.png" alt="赫眉 HYMN"><span class="st">POSTER</span></div>
<header class="pagehead g-only">
  <div class="eyebrow">赫眉 HYMN · 门店活动</div>
  <h2>门店海报</h2>
  <p>先选一个海报，再选门店，店名、电话、地址自动换好</p>
</header>
<section class="gallery g-only">
  <div class="tpl-list" id="tpl-list"></div>
  <div class="loading">海报加载中…</div>
</section>

<header class="pagehead e-only">
  <a class="back" href="?">← 全部海报</a>
  <h2 id="tpl-name">门店海报</h2>
</header>
<main class="e-only">
  <section class="stage">
    <div class="view">
      <div class="grid" id="grid"></div>
      <canvas id="preview" width="1254" height="1254"></canvas>
    </div>
    <div class="loading">字体加载中…</div>
    <div class="hint-mobile"><span class="one">点海报可看大图</span><span class="many">点哪张，信息就在哪张下面；再点一次看大图</span></div>
    <div class="actions">
      <button class="btn solid" id="dl-png">下载图片</button>
      <button class="btn" id="dl-pdf">下载 PDF</button>
    </div>
  </section>

  <section class="sec pick">
    <h3>选择门店 · 可多选</h3>
    <div class="combo">
      <svg class="mag" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6"/><line x1="13" y1="13" x2="18" y2="18"/></svg>
      <input type="text" id="store" placeholder="搜店名 / 拼音 / 经理名" autocomplete="off" enterkeyhint="search">
      <button class="done" id="store-done" type="button">完成</button>
      <ul id="store-list" hidden></ul>
    </div>
    <div class="chips" id="chips" hidden></div>
    <div class="tip" id="pick-tip">可以搜索，也可以勾选多家一起下载</div>
  </section>

  <section class="sec info">
    <h3>本店信息<span id="info-name"></span> · 已自动带出，可改</h3>
    <label>电话</label>
    <input type="text" id="phone" inputmode="tel">
    <label>地址</label>
    <input type="text" id="address">
    <div class="note" id="hint-addr" hidden>这家店还没登记地址，请手动填写</div>
  </section>

  <section class="sec act">
    <details>
      <summary>活动内容</summary>
      <label>标题（换店时店名会自动换）</label>
      <input type="text" id="title" data-k="title">
      <label>领取时间</label>
      <input type="text" data-k="date">
      <div class="row3">
        <div><label>大字价格</label><input type="text" data-k="price"></div>
        <div><label>礼包价值</label><input type="text" data-k="worth"></div>
        <div><label>礼包名</label><input type="text" data-k="bundle"></div>
      </div>
      <label>礼品 1（名称 / 价值 / 图片）</label>
      <div class="item">
        <input type="text" data-k="item1.name"><input type="text" data-k="item1.value">
        <label class="btn sm" style="margin:0">换图<input type="file" id="img1-file" accept="image/*"></label>
      </div>
      <label>礼品 2</label>
      <div class="item">
        <input type="text" data-k="item2.name"><input type="text" data-k="item2.value">
        <label class="btn sm" style="margin:0">换图<input type="file" id="img2-file" accept="image/*"></label>
      </div>
      <label>礼品 3（券）</label>
      <div class="item" style="grid-template-columns:1fr 86px">
        <input type="text" data-k="item3.name"><input type="text" data-k="item3.value">
      </div>
      <button class="link" id="reset">恢复默认内容</button>
    </details>
  </section>
</main>

<div id="sheet" hidden>
  <div class="sheet-imgs" id="sheet-imgs"></div>
  <p id="sheet-tip"></p>
  <div class="sheet-btns">
    <button class="btn save" id="sheet-save" hidden>保存到手机</button>
    <button class="btn" id="sheet-close">关闭</button>
  </div>
</div>

<script src="assets/assets.js?v=202610261201"></script>
<script src="data/stores.js?v=202610261201"></script>
<script src="data/pinyin.js?v=202610261201"></script>
<script src="data/activity.js?v=202610261201"></script>
<script src="js/poster.js?v=202610261201"></script>
<script src="data/templates.js?v=202610261201"></script>
<script src="js/app.js?v=202610261201"></script>
</body>
</html>
